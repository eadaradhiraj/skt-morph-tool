[package]
name = "skt-morph-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
deadpool-sqlite = "0.8"
fancy-regex = "0.13"
lazy_static = "1.4"
tower-http = { version = "0.7.0", features = ["fs"] }
