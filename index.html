<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skt-morph | Sanskrit Engine</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #121212; color: #ffffff; max-width: 900px; margin: 0 auto; padding: 2rem; }
        h1 { color: #f59e0b; text-align: center; margin-bottom: 0.5rem; }
        p.subtitle { text-align: center; color: #a1a1aa; margin-bottom: 2rem; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 1.5rem; justify-content: center; flex-wrap: wrap; border-bottom: 1px solid #333; padding-bottom: 1.5rem; }
        select, input { padding: 10px; background: #1e1e1e; color: white; border: 1px solid #333; border-radius: 8px; font-size: 1rem; }
        input { width: 100%; max-width: 400px; font-size: 1.1rem; }
        button { padding: 10px 20px; font-size: 1.1rem; border-radius: 8px; border: none; background: #f59e0b; color: #121212; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #d97706; }
        
        /* Tabs */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 2rem; }
        .tab-btn { background: #27272a; color: #a1a1aa; border: 1px solid #333; }
        .tab-btn.active { background: #f59e0b; color: #121212; border-color: #f59e0b; }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .search-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; }
        
        /* Tables */
        .category-title { color: #f59e0b; border-bottom: 1px solid #333; padding-bottom: 0.5rem; margin-top: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; font-size: 1.1rem; }
        th { background: #27272a; color: #a1a1aa; font-weight: 600; font-size: 1rem; }
        tr:hover { background: #2a2a2a; }
        
        .loading { opacity: 0.5; pointer-events: none; }
        .error-msg { color: #ef4444; text-align: center; padding: 1rem; background: #450a0a; border-radius: 8px; margin-top: 1rem; }
        
        #rawJson { margin-top: 3rem; background: #1e1e1e; padding: 1rem; border-radius: 8px; font-size: 0.9rem; color: #6ee7b7; overflow-x: auto; display: none; }
        .toggle-json { background: transparent; border: 1px solid #f59e0b; color: #f59e0b; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>Sanskrit Morphological Engine</h1>
    <p class="subtitle">Powered by Rust & SQLite Edge</p>

    <div class="controls">
        <select id="inputScript">
            <option value="slp1">Input: SLP1</option>
            <option value="devanagari">Input: Devanagari</option>
            <option value="hk">Input: Harvard-Kyoto</option>
        </select>
        <span style="display:flex; align-items:center; color:#a1a1aa;">&rarr;</span>
        <select id="outputScript">
            <option value="devanagari">Output: Devanagari</option>
            <option value="iast">Output: IAST</option>
            <option value="slp1">Output: SLP1</option>
        </select>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('analyzeTab')">Analyzer</button>
        <button class="tab-btn" onclick="switchTab('generateTab')">Generator</button>
    </div>

    <div id="analyzeTab" class="tab-content active">
        <div class="search-row">
            <input type="text" id="analyzeInput" placeholder="Word to analyze (e.g. prakaroti)" autocomplete="off" spellcheck="false" />
            <button onclick="runAnalyzer()">Analyze</button>
        </div>
    </div>

    <div id="generateTab" class="tab-content">
        <div class="search-row">
            <input type="text" id="genRoot" placeholder="Root (e.g. kf)" style="max-width: 150px;" />
            <input type="text" id="genUpa" placeholder="Prefix (e.g. pra)" style="max-width: 150px;" />
            <select id="genLakara">
                <option value="law">Laṭ (Present)</option>
                <option value="low">Loṭ (Imperative)</option>
                <option value="laN">Laṅ (Imperfect)</option>
                <option value="viDiliN">Vidhi Liṅ (Optative)</option>
                <option value="lfw">Lṛṭ (Future)</option>
                <option value="liw">Liṭ (Perfect)</option>
                <option value="luw">Luṭ (Periphrastic Fut.)</option>
                <option value="ASIrliN">Āśīr Liṅ (Benedictive)</option>
                <option value="luN">Luṅ (Aorist)</option>
            </select>
        </div>
        <div class="search-row">
            <select id="genPurusha">
                <option value="praTama">Prathama (3rd Person)</option>
                <option value="maDyama">Madhyama (2nd Person)</option>
                <option value="uttama">Uttama (1st Person)</option>
            </select>
            <select id="genVoice">
                <option value="parasmEpadam">Parasmaipada</option>
                <option value="Atmanepadam">Ātmanepada</option>
                <option value="karmaRi">Karmaṇi (Passive)</option>
            </select>
            <button onclick="runGenerator()">Generate</button>
        </div>
    </div>

    <div id="resultsContainer"></div>
    <button id="jsonBtn" class="toggle-json" style="display: none;" onclick="toggleJson()">Show Raw JSON</button>
    <pre id="rawJson"></pre>

    <script>
        // --- TRANSLITERATION ENGINE ---
        const D_CONS = {'क':'k','ख':'K','ग':'g','घ':'G','ङ':'N','च':'c','छ':'C','ज':'j','झ':'J','ञ':'Y','ट':'w','ठ':'W','ड':'q','ढ':'Q','ण':'R','त':'t','थ':'T','द':'d','ध':'D','न':'n','प':'p','फ':'P','ब':'b','भ':'B','म':'m','य':'y','र':'r','ल':'l','व':'v','श':'S','ष':'z','स':'s','ह':'h'};
        const D_VOWS = {'अ':'a','आ':'A','इ':'i','ई':'I','उ':'u','ऊ':'U','ऋ':'f','ॠ':'F','ऌ':'x','ॡ':'X','ए':'e','ऐ':'E','ओ':'o','औ':'O'};
        const D_MRKS = {'ा':'A','ि':'i','ी':'I','ु':'u','ू':'U','ृ':'f','ॄ':'F','ॢ':'x','ॣ':'X','े':'e','ै':'E','ो':'o','ौ':'O'};
        const D_SYMB = {'ं':'M','ः':'H','ँ':'~','ऽ':"'"};

        const S_CONS = {'k':'क','K':'ख','g':'ग','G':'घ','N':'ङ','c':'च','C':'छ','j':'ज','J':'झ','Y':'ञ','w':'ट','W':'ठ','q':'ड','Q':'ढ','R':'ण','t':'त','T':'थ','d':'d','D':'ध','n':'न','p':'p','P':'फ','b':'b','B':'bh','m':'m','y':'y','r':'r','l':'l','v':'v','S':'श','z':'ष','s':'स','h':'h'};
        const S_VOWS = {'a':'अ','A':'आ','i':'इ','I':'ई','u':'उ','U':'ऊ','f':'ऋ','F':'ॠ','x':'ऌ','X':'ॡ','e':'ए','E':'ऐ','o':'ओ','O':'औ'};
        const S_MRKS = {'A':'ा','i':'ि','I':'ी','u':'ु','U':'ू','f':'ृ','F':'ॄ','x':'ॢ','X':'ॣ','e':'e','E':'ै','o':'ो','O':'ौ'};
        
        const HK_TO_SLP = {'a':'a','A':'A','i':'i','I':'I','u':'u','U':'U','R':'f','RR':'F','lR':'x','lRR':'X','e':'e','ai':'E','o':'o','au':'O','M':'M','H':'H','k':'k','kh':'K','g':'g','gh':'G','G':'N','c':'c','ch':'C','j':'j','jh':'J','J':'Y','T':'w','Th':'W','D':'q','Dh':'Q','N':'R','t':'t','th':'T','d':'d','dh':'D','n':'n','p':'p','ph':'P','b':'b','bh':'B','m':'m','y':'y','r':'r','l':'l','v':'v','z':'S','S':'z','s':'s','h':'h'};
        const SLP_TO_IAST = {'A':'ā','I':'ī','U':'ū','f':'ṛ','F':'ṝ','x':'ḷ','X':'ḹ','E':'ai','O':'au','K':'kh','g':'g','G':'gh','N':'ṅ','c':'c','C':'ch','j':'j','J':'jh','Y':'ñ','w':'ṭ','W':'ṭh','q':'ḍ','Q':'ḍh','R':'ṇ','t':'t','T':'th','d':'d','D':'dh','n':'n','p':'p','P':'ph','b':'b','B':'bh','m':'m','y':'y','r':'r','l':'l','v':'v','S':'ś','z':'ṣ','s':'s','h':'h','M':'ṃ','H':'ḥ','~':'m̐'};

        function devaToSlp1(str) {
            let res = "";
            for (let i = 0; i < str.length; i++) {
                let c = str[i];
                if (D_CONS[c]) {
                    res += D_CONS[c];
                    let next = str[i+1];
                    if (!next || (!D_MRKS[next] && next !== '्')) res += 'a';
                } else if (D_VOWS[c]) res += D_VOWS[c];
                else if (D_MRKS[c]) res += D_MRKS[c];
                else if (D_SYMB[c]) res += D_SYMB[c];
                else if (c !== '्') res += c;
            }
            return res;
        }

        function slp1ToDeva(str) {
            let res = "";
            for (let i = 0; i < str.length; i++) {
                let c = str[i];
                if (S_VOWS[c]) {
                    if (i === 0 || !S_CONS[str[i-1]]) res += S_VOWS[c];
                    else if (c !== 'a') res += S_MRKS[c];
                } else if (S_CONS[c]) {
                    res += S_CONS[c];
                    let next = str[i+1];
                    if (!next || (!S_VOWS[next] && !D_SYMB[next])) res += '्';
                } else if (D_SYMB[c]) res += Object.keys(D_SYMB).find(k => D_SYMB[k] === c);
                else res += c;
            }
            return res;
        }

        function hkToSlp1(str) {
            let res = str;
            let multi = {'kh':'K','gh':'G','ch':'C','jh':'J','Th':'W','Dh':'Q','th':'T','dh':'D','ph':'P','bh':'B','ai':'E','au':'O','RR':'F','lR':'x','lRR':'X'};
            for (let k in multi) res = res.split(k).join(multi[k]);
            for (let i = 0; i < res.length; i++) if (HK_TO_SLP[res[i]]) res = res.substring(0, i) + HK_TO_SLP[res[i]] + res.substring(i + 1);
            return res;
        }

        function slp1ToIast(str) {
            let res = "";
            for (let char of str) {
                if (SLP_TO_IAST[char]) res += SLP_TO_IAST[char];
                else res += char.toLowerCase();
            }
            return res;
        }

        // --- DOM Elements & Tab Logic ---
        const inScript = document.getElementById('inputScript');
        const outScript = document.getElementById('outputScript');
        const container = document.getElementById('resultsContainer');
        const rawJson = document.getElementById('rawJson');
        const jsonBtn = document.getElementById('jsonBtn');

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            container.innerHTML = ''; jsonBtn.style.display = 'none'; rawJson.style.display = 'none';
        }

        function toggleJson() { rawJson.style.display = rawJson.style.display === 'none' ? 'block' : 'none'; }

        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('input', () => { if (/[\u0900-\u097F]/.test(inp.value)) inScript.value = 'devanagari'; });
        });

        function normalizeToSLP1(word) {
            if (inScript.value === 'devanagari') return devaToSlp1(word);
            if (inScript.value === 'hk') return hkToSlp1(word);
            return word;
        }

        function renderOutput(slp1Text, columnTitle) {
            if (!slp1Text || slp1Text === '-') return '-';
            if (['Dhatu ID', 'Meaning Hint'].includes(columnTitle)) return slp1Text;
            if (/^[0-9.]+$/.test(slp1Text)) return slp1Text;

            const rawTags = ['masc', 'fem', 'neut', 'eka', 'dvi', 'bahu', 'masc/fem', 'masc/neut', 'masc/fem/neut', 'any'];
            
            return slp1Text.split(' ').map(word => {
                if (rawTags.includes(word.toLowerCase())) return word;
                if (outScript.value === 'devanagari') return slp1ToDeva(word);
                if (outScript.value === 'iast') return slp1ToIast(word);
                return word;
            }).join(' ');
        }

        function createTable(title, columns, dataRows) {
            if (!dataRows || dataRows.length === 0) return '';
            let html = `<h2 class="category-title">${title}</h2><table><thead><tr>`;
            columns.forEach(c => html += `<th>${c}</th>`);
            html += `</tr></thead><tbody>`;
            dataRows.forEach(row => {
                html += `<tr>`;
                columns.forEach(c => {
                    const key = c.toLowerCase().replace(' ', '_');
                    const val = row[key] || row[c] || '-';
                    html += `<td>${renderOutput(val, c)}</td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            return html;
        }

        async function fetchAPI(url) {
            container.innerHTML = "<p style='text-align:center;'>Querying Database...</p>";
            document.body.classList.add('loading');
            jsonBtn.style.display = 'none'; rawJson.style.display = 'none';

            try {
                const response = await fetch(url);
                const data = await response.json();
                rawJson.innerText = JSON.stringify(data, null, 2);
                return data;
            } catch (err) {
                container.innerHTML = `<div class='error-msg'>Server Error: ${err.message}</div>`;
                throw err;
            } finally {
                document.body.classList.remove('loading');
            }
        }

        async function runAnalyzer() {
            const rawWord = document.getElementById('analyzeInput').value.trim();
            if (!rawWord) return;
            const word = normalizeToSLP1(rawWord);
            
            const data = await fetchAPI(`/api/analyze/${word}`);
            if (!data) return;

            let html = '';
            html += createTable('Verbs (Tiṅanta)', ['Dhatu ID', 'Upasarga', 'Lakara', 'Purusha', 'Vacana', 'Voice'], data.verbs);
            html += createTable('Declensions (Subanta)', ['Base Form', 'Dhatu ID', 'Upasarga', 'Pratyaya', 'Gender', 'Case', 'Vacana'], data.declensions);
            html += createTable('Participles / Avyayas', ['Base Form', 'Pratyaya', 'Dhatu ID', 'Upasarga'], data.participles);
            html += createTable('Namadhatus', ['Base Noun', 'Pratyaya', 'Meaning Hint'], data.namadhatus);
            html += createTable('Pronouns', ['Base Form', 'Gender', 'Case', 'Vacana'], data.pronouns);
            html += createTable('Numerals', ['Base Form', 'Gender', 'Case', 'Vacana'], data.numerals);
            html += createTable('Irregular Nouns', ['Base Form', 'Gender', 'Case', 'Vacana'], data.irregulars);

            if (!html) html = `<div class='error-msg'>No matches found for "${rawWord}". Try an un-sandhied word.</div>`;
            container.innerHTML = html;
            if(html && !html.includes('error-msg')) jsonBtn.style.display = 'block';
        }

        async function runGenerator() {
            const root = normalizeToSLP1(document.getElementById('genRoot').value.trim());
            const upa = normalizeToSLP1(document.getElementById('genUpa').value.trim());
            if (!root) return alert("Please enter a root or Dhatu ID.");

            const params = new URLSearchParams({
                root: root, upasarga: upa,
                lakara: document.getElementById('genLakara').value,
                purusha: document.getElementById('genPurusha').value,
                voice: document.getElementById('genVoice').value
            });

            const data = await fetchAPI(`/api/generate/verb?${params}`);
            if (!data || data.error) {
                container.innerHTML = `<div class='error-msg'>${data ? data.error : "Generation Failed"}</div>`;
                return;
            }

            container.innerHTML = createTable('Generated Verb', ['Eka', 'Dvi', 'Bahu'], [data]);
            jsonBtn.style.display = 'block';
        }

        document.getElementById('analyzeInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') runAnalyzer(); });
        document.getElementById('genRoot').addEventListener('keypress', (e) => { if (e.key === 'Enter') runGenerator(); });
        
        outScript.addEventListener('change', () => { 
            const activeTab = document.querySelector('.tab-btn.active').innerText;
            if (container.innerHTML && !container.innerHTML.includes('No matches') && !container.innerHTML.includes('Error')) {
                if (activeTab === 'Analyzer') runAnalyzer();
                if (activeTab === 'Generator') runGenerator();
            }
        });
    </script>
</body>
</html>
