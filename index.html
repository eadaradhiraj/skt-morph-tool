<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skt-morph | Sanskrit Engine</title>
    <!-- Pointing to the local Rust route instead of the internet! -->
    <script src="/sanscript.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #121212; color: #ffffff; max-width: 900px; margin: 0 auto; padding: 2rem; }
        h1 { color: #f59e0b; text-align: center; margin-bottom: 0.5rem; }
        p.subtitle { text-align: center; color: #a1a1aa; margin-bottom: 2rem; }
        .controls { display: flex; gap: 10px; margin-bottom: 1rem; justify-content: center; flex-wrap: wrap; }
        select { padding: 10px; background: #27272a; color: white; border: 1px solid #333; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .search-box { display: flex; gap: 10px; margin-bottom: 2rem; justify-content: center; }
        input { width: 100%; max-width: 400px; padding: 12px; font-size: 1.2rem; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: white; }
        button { padding: 12px 24px; font-size: 1.2rem; border-radius: 8px; border: none; background: #f59e0b; color: #121212; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #d97706; }
        .category-title { color: #f59e0b; border-bottom: 1px solid #333; padding-bottom: 0.5rem; margin-top: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; font-size: 1.1rem; }
        th { background: #27272a; color: #a1a1aa; font-weight: 600; font-size: 1rem; }
        tr:hover { background: #2a2a2a; }
        .loading { opacity: 0.5; pointer-events: none; }
        #rawJson { margin-top: 3rem; background: #1e1e1e; padding: 1rem; border-radius: 8px; font-size: 0.9rem; color: #6ee7b7; overflow-x: auto; display: none; }
        .toggle-json { background: transparent; border: 1px solid #f59e0b; color: #f59e0b; margin-top: 1rem; }
        .error-msg { color: #ef4444; text-align: center; padding: 1rem; background: #450a0a; border-radius: 8px; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>Sanskrit Morphological Engine</h1>
    <p class="subtitle">Type a word in Devanagari, IAST, or SLP1</p>

    <div class="controls">
        <select id="inputScript">
            <option value="slp1">Input: SLP1</option>
            <option value="devanagari">Input: Devanagari</option>
            <option value="hk">Input: Harvard-Kyoto</option>
        </select>
        <span style="display:flex; align-items:center; color:#a1a1aa;">&rarr;</span>
        <select id="outputScript">
            <option value="devanagari">Output: Devanagari</option>
            <option value="iast">Output: IAST</option>
            <option value="slp1">Output: SLP1</option>
        </select>
    </div>
    
    <div class="search-box">
        <input type="text" id="wordInput" placeholder="e.g., प्राकरोति, vyAkaroti" autocomplete="off" spellcheck="false" />
        <button id="searchBtn">Analyze</button>
    </div>

    <div id="resultsContainer"></div>

    <button id="jsonBtn" class="toggle-json" style="display: none;">Show Raw JSON</button>
    <pre id="rawJson"></pre>

    <script>
        const input = document.getElementById('wordInput');
        const btn = document.getElementById('searchBtn');
        const container = document.getElementById('resultsContainer');
        const rawJson = document.getElementById('rawJson');
        const jsonBtn = document.getElementById('jsonBtn');
        const inputScript = document.getElementById('inputScript');
        const outputScript = document.getElementById('outputScript');

        // Auto-detect Devanagari input for user convenience
        input.addEventListener('input', () => {
            if (/[\u0900-\u097F]/.test(input.value)) {
                inputScript.value = 'devanagari';
            }
        });

        // Convert whatever the user types into SLP1 for the Backend
        function normalizeToSLP1(word) {
            if (typeof Sanscript === 'undefined') return word;
            const inScript = inputScript.value;
            if (inScript === 'slp1') return word;
            return Sanscript.t(word, inScript, 'slp1');
        }

        // Convert the SLP1 JSON data into the requested Output Script
        function renderText(slp1Text, column) {
            if (!slp1Text || slp1Text === '-') return '-';
            if (typeof Sanscript === 'undefined') return slp1Text;
            
            const target = outputScript.value;
            if (target === 'slp1') return slp1Text;
            
            // Protect structural data and English labels from transliteration
            if (['Dhatu ID', 'Meaning Hint'].includes(column)) return slp1Text;
            
            const rawTags = ['masc', 'fem', 'neut', 'eka', 'dvi', 'bahu', 'masc/fem', 'masc/neut', 'masc/fem/neut', 'any'];
            
            return slp1Text.split(' ').map(word => {
                if (rawTags.includes(word.toLowerCase())) return word; // Leave grammar tags in English
                return Sanscript.t(word, 'slp1', target);
            }).join(' ');
        }

        function createTable(title, columns, dataRows) {
            if (!dataRows || dataRows.length === 0) return '';
            let html = `<h2 class="category-title">${title}</h2><table><thead><tr>`;
            columns.forEach(c => html += `<th>${c}</th>`);
            html += `</tr></thead><tbody>`;
            dataRows.forEach(row => {
                html += `<tr>`;
                columns.forEach(c => {
                    const key = c.toLowerCase().replace(' ', '_');
                    const val = row[key] || '-';
                    html += `<td>${renderText(val, c)}</td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            return html;
        }

        async function searchWord() {
            const rawWord = input.value.trim();
            if (!rawWord) return;
            
            if (typeof Sanscript === 'undefined') {
                container.innerHTML = `<div class='error-msg'>Fatal Error: sanscript.js failed to load locally!</div>`;
                return;
            }

            const slp1Word = normalizeToSLP1(rawWord);
            
            container.innerHTML = "<p style='text-align:center;'>Querying Database...</p>";
            document.body.classList.add('loading');
            jsonBtn.style.display = 'none';
            rawJson.style.display = 'none';

            try {
                const response = await fetch(`/api/analyze/${slp1Word}`);
                const data = await response.json();
                
                let html = '';
                html += createTable('Verbs (Tiṅanta)', ['Dhatu ID', 'Upasarga', 'Lakara', 'Purusha', 'Vacana', 'Voice'], data.verbs);
                html += createTable('Declensions (Subanta)', ['Base Form', 'Dhatu ID', 'Upasarga', 'Pratyaya', 'Gender', 'Case', 'Vacana'], data.declensions);
                html += createTable('Participles / Avyayas', ['Base Form', 'Pratyaya', 'Dhatu ID', 'Upasarga'], data.participles);
                html += createTable('Namadhatus', ['Base Noun', 'Pratyaya', 'Meaning Hint'], data.namadhatus);
                html += createTable('Pronouns', ['Base Form', 'Gender', 'Case', 'Vacana'], data.pronouns);
                html += createTable('Numerals', ['Base Form', 'Gender', 'Case', 'Vacana'], data.numerals);
                html += createTable('Irregular Nouns', ['Base Form', 'Gender', 'Case', 'Vacana'], data.irregulars);

                if (!html) {
                    html = `<div class='error-msg'>No matches found for "${rawWord}" (parsed as SLP1: ${slp1Word}).<br>Try entering an un-sandhied word.</div>`;
                }

                container.innerHTML = html;
                rawJson.innerText = JSON.stringify(data, null, 2);
                if(html && !html.includes('error-msg')) jsonBtn.style.display = 'block';

            } catch (err) {
                container.innerHTML = `<div class='error-msg'>Server Error: ${err.message}</div>`;
            } finally {
                document.body.classList.remove('loading');
            }
        }

        btn.addEventListener('click', searchWord);
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchWord(); });
        jsonBtn.addEventListener('click', () => { rawJson.style.display = rawJson.style.display === 'none' ? 'block' : 'none'; });
        outputScript.addEventListener('change', () => { if (container.innerHTML && !container.innerHTML.includes('No matches')) searchWord(); });
    </script>
</body>
</html>
